<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Events</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0d1b2a;color:#f5f0e1;font-family:-apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}
    .loader{animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    h2{font-size:1rem;font-weight:400;color:#8b8b9e;margin-top:12px}
    .dot{display:inline-block;animation:bounce .6s infinite alternate}
    .dot:nth-child(2){animation-delay:.2s}
    .dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce{to{opacity:.2}}
  </style>
</head>
<body>
  <div>
    <div class="loader" style="font-size:3rem">🍜</div>
    <h2>Starting server<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></h2>
  </div>
  <script>
    async function waitForServer() {
      const maxAttempts = 30;
      for (let i = 0; i < maxAttempts; i++) {
        try {
          const res = await fetch('http://127.0.0.1:8787/api/state');
          if (res.ok) {
            window.location.href = 'http://127.0.0.1:8787/';
            return;
          }
        } catch (e) {}
        await new Promise(r => setTimeout(r, 500));
      }
      document.querySelector('h2').textContent = 'Server failed to start';
    }
    waitForServer();
  </script>
</body>
</html>
